<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sitio Institucional Plantilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  --azul:#b22623; --azul-osc:#8a1b19; --azul-med:#c0302c;
  --acento:#8a6508; --acento-claro:#f0c14b;
  --bg:#f7f6f3; --surface:#ffffff; --surface-2:#f0eeea;
  --line:#e4dcdb; --text:#231a1a; --muted:#645a58; --link:#9a1f1c;
  --bar-text:#f6e6e4; --ok:#2f7a4b; --danger:#a2352c;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#161212; --surface:#201a1a; --surface-2:#2a2222; --line:#3d3131;
  --text:#eee6e5; --muted:#b0a3a1; --link:#f0c14b; --acento:#e3b440;
  --azul:#8e1e1b; --azul-osc:#5e1412; --azul-med:#a82a26; --ok:#5fbf85; --danger:#e07b70;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#161212; --surface:#201a1a; --surface-2:#2a2222; --line:#3d3131;
  --text:#eee6e5; --muted:#b0a3a1; --link:#f0c14b; --acento:#e3b440;
  --azul:#8e1e1b; --azul-osc:#5e1412; --azul-med:#a82a26; --ok:#5fbf85; --danger:#e07b70;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
@media(min-width:700px){.wrap{padding-inline:24px}}

/* ===== Sitio público ===== */
.topbar{background:var(--azul-osc);color:var(--bar-text);font-size:.8rem;letter-spacing:.03em}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px;flex-wrap:wrap}
.topbar a{color:var(--bar-text)}
.topbar a:hover{color:var(--acento-claro);text-decoration:none}
.tb-left,.tb-right{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tb-left .aula{font-weight:700;text-transform:uppercase;color:var(--acento-claro)}
.tb-search{display:flex;align-items:center;background:rgba(255,255,255,.08);border-radius:3px}
.tb-search input{background:transparent;border:0;color:#fff;padding:3px 8px;width:140px;font:inherit}
.tb-search input::placeholder{color:#ecc7c4}
.pending{opacity:.55;cursor:default}

header.main{background:var(--surface);border-bottom:3px solid var(--azul);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:16px}
.brand{color:var(--text);display:flex;align-items:center;gap:12px;max-width:380px}
.brand-iso{width:58px;height:58px;flex:none}
.brand-txt{display:block;min-width:0}
.brand:hover{text-decoration:none}
.brand-name{font:700 1.55rem/1.05 var(--serif);letter-spacing:.02em;display:block}
.brand-tag{font-size:.75rem;color:var(--muted);display:block;margin-top:3px}
nav.menu ul{list-style:none;margin:0;padding:0}
nav.menu>ul{display:flex;gap:0}
nav.menu li{position:relative}
nav.menu>ul>li>a{display:block;padding:10px 10px;color:var(--text);font-weight:600;font-size:.93rem;border-bottom:3px solid transparent;margin-bottom:-3px}
nav.menu>ul>li>a:hover,nav.menu>ul>li.on>a{color:var(--link);border-bottom-color:var(--acento);text-decoration:none}
nav.menu .sub{position:absolute;left:0;top:100%;min-width:240px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--acento);box-shadow:0 8px 24px rgba(90,20,18,.14);padding:6px 0;display:none}
nav.menu li:last-child .sub,nav.menu li:nth-last-child(2) .sub{left:auto;right:0}
nav.menu li:hover>.sub,nav.menu li:focus-within>.sub{display:block}
nav.menu .sub a{display:block;padding:7px 16px;color:var(--text);font-size:.92rem}
nav.menu .sub a:hover{background:var(--surface-2);color:var(--link);text-decoration:none}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:3px}
@media(max-width:1060px){
  .burger{display:block}
  nav.menu{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:3px solid var(--azul);max-height:70vh;overflow:auto}
  nav.menu.open{display:block}
  nav.menu>ul{flex-direction:column;padding:8px 16px}
  nav.menu .sub{position:static;display:block;border:0;box-shadow:none;padding:0 0 8px 12px}
  .tb-search input{width:100px}
}

.pagehead{background:var(--azul);color:#fff;padding-block:30px 26px}
.crumbs{font-size:.82rem;color:#f3d6d4;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:#f3d6d4}
.crumbs a:hover{color:var(--acento-claro)}
.pagehead h1{font:600 clamp(2rem,4.5vw,2.9rem)/1.1 var(--serif);margin:.35em 0 0;text-wrap:balance}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;padding-block:36px 56px}
.layout.full{grid-template-columns:1fr}
@media(max-width:820px){.layout{grid-template-columns:1fr;gap:24px}}
.side h2{font:600 .78rem/1 var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
.side ul{list-style:none;margin:0 0 28px;padding:0;border-top:1px solid var(--line)}
.side li a{display:block;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--text);font-size:.95rem;border-left:3px solid transparent}
.side li a:hover{background:var(--surface-2);text-decoration:none}
.side li a.on{border-left-color:var(--acento);font-weight:700;color:var(--link);background:var(--surface)}

article.content{max-width:760px}
article.content h2{font:600 1.75rem/1.2 var(--serif);margin:1.6em 0 .4em;padding-bottom:6px;border-bottom:1px solid var(--line)}
article.content>h2:first-child{margin-top:0}
article.content p{margin:0 0 1em}
article.content ul.md{margin:0 0 1em;padding-left:1.3em}
.empty{padding:26px;border:1px dashed var(--line);color:var(--muted);text-align:center;font-size:.95rem}
.empty a{font-weight:600}

.entries-title{font:600 1.5rem/1.2 var(--serif);margin:36px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.entry{display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px;padding-block:18px;border-bottom:1px solid var(--line)}
.entry.noimg{grid-template-columns:1fr}
@media(max-width:560px){.entry{grid-template-columns:1fr}}
.thumb{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);overflow:hidden;display:block}
.thumb img{width:100%;height:100%;object-fit:cover}
.meta{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;gap:10px;flex-wrap:wrap}
.meta .cat{color:var(--acento);font-weight:700}
.entry h3{font:600 1.4rem/1.2 var(--serif);margin:.2em 0 .3em;text-wrap:balance}
.entry h3 a{color:var(--text)}
.entry p{margin:0;color:var(--muted)}
.more{font-weight:600;font-size:.9rem}
.full-entry .cover{margin:0 0 20px;max-width:100%}
.full-entry h1{font:600 clamp(1.8rem,4vw,2.4rem)/1.15 var(--serif);margin:.2em 0 .5em;text-wrap:balance}
.lead{font-size:1.12rem}

.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:8px}
.home-card{border:1px solid var(--line);background:var(--surface);padding:18px}
.home-card h3{font:600 1.25rem/1.2 var(--serif);margin:0 0 8px}
.home-card ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.92rem}

footer.site{background:var(--azul-osc);color:var(--bar-text);font-size:.9rem}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:32px;padding-block:40px}
@media(max-width:820px){.foot{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.foot{grid-template-columns:1fr}}
footer.site h4{font:600 .78rem/1 var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--acento-claro);margin:0 0 12px}
footer.site ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
footer.site a{color:var(--bar-text)}
footer.site a:hover{color:var(--acento-claro)}
.foot-logo{width:100%;max-width:300px;height:auto;display:block;margin-bottom:14px}
.foot .fname{font:700 1.45rem/1.1 var(--serif);color:#fff;margin-bottom:8px}
.foot-bottom{border-top:1px solid rgba(255,255,255,.12);padding-block:14px;font-size:.8rem;color:#dcb5b2;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ph{color:#d9a9a5;font-style:italic}

/* ===== Panel de carga ===== */
.adm-bar{background:var(--azul-osc);color:#fff}
.adm-bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.adm-bar b{font:700 1.2rem var(--serif);letter-spacing:.03em}
.adm-bar a{color:var(--acento-claro);font-weight:600}
.adm{display:grid;grid-template-columns:280px minmax(0,1fr);gap:32px;padding-block:28px 56px}
@media(max-width:820px){.adm{grid-template-columns:1fr}}
.tree{background:var(--surface);border:1px solid var(--line);padding:10px 0;align-self:start;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:12px}
@media(max-width:820px){.tree{position:static;max-height:none}}
.tree h3{font:700 .72rem/1 var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:14px 16px 6px}
.tree a{display:flex;justify-content:space-between;gap:8px;padding:5px 16px;color:var(--text);font-size:.92rem;border-left:3px solid transparent}
.tree a:hover{background:var(--surface-2);text-decoration:none}
.tree a.on{border-left-color:var(--acento);background:var(--surface-2);font-weight:700}
.tree .n{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tree .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;vertical-align:middle}
.tree .dot.off{background:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);padding:22px;margin-bottom:22px}
.card h2{font:600 1.5rem/1.2 var(--serif);margin:0 0 4px}
.card .sub{color:var(--muted);font-size:.9rem;margin:0 0 16px}
form.f{display:grid;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],textarea,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:2px;width:100%}
textarea{min-height:200px;resize:vertical;line-height:1.55}
.hint{font-weight:400;font-size:.8rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--azul-med);color:#fff;padding:9px 18px;font-weight:700;border-radius:2px}
.btn:hover{background:var(--azul)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.tbl{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:.92rem}
table.list th,table.list td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.list th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--link);padding:0 8px 0 0;font-weight:600}
.linkbtn.del{color:var(--danger)}
.login{max-width:380px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--acento);padding:28px}
.login h2{font:600 1.6rem/1.2 var(--serif);margin:0 0 6px}
.login p{color:var(--muted);font-size:.9rem;margin:0 0 18px}
.login .err{color:var(--danger);font-size:.9rem;min-height:1.3em}
input[type=password]{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:2px;width:100%}
.adm-bar .right{display:flex;gap:16px;align-items:center}
.adm-bar .linkbtn{color:#f6e6e4;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:3px;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:99;max-width:calc(100% - 32px)}
.toast.err{background:var(--danger);color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="topbar"><div class="wrap">
    <div class="tb-left">
      <a class="aula" href="#p-cursos-virtuales">Aula virtual</a>

    </div>
    <div class="tb-right">
      <form class="tb-search" id="searchForm" role="search"><input id="q" type="text" placeholder="Buscar en el sitio" aria-label="Buscar en el sitio"></form>
      <a href="#panel">Panel de carga</a>

  </div></div>

const fmtDate=iso=>{if(!iso)return'';const d=new Date(iso+'T12:00:00');return isNaN(d)?iso:d.toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'})};

/* Mapa del sitio (estructura tomada de IDES) */
const MAP=[
 {k:'institucional',t:'Institucional',p:[['acerca','Acerca de'],['autoridades','Autoridades'],['asociate','Asociate'],['convenios','Convenios'],['servicios','Servicios'],['contacto','Contacto']]},
 {k:'investigacion',t:'Investigación',p:[['acerca-centro','Acerca del centro'],['autoridades-centro','Autoridades del centro'],['integrantes','Integrantes'],['programas','Programas'],['proyectos','Buscador de proyectos']]},
 {k:'formacion',t:'Formación',p:[['posgrados','Posgrados'],['cursos-virtuales','Cursos virtuales'],['pago-cursos','Pago de cursos'],['cultura','Cultura']]},
 {k:'consultorias',t:'Consultorías',p:[['transferencia','Consultorías y transferencia'],['listado-consultorias','Listado de consultorías']]},
 {k:'biblioteca',t:'Biblioteca',p:[['presentacion','Presentación'],['servicios-biblioteca','Servicios'],['catalogo','Catálogo'],['fondos-especiales','Fondos especiales'],['bases-datos','Bases de datos'],['contacto-biblioteca','Contacto']]},
 {k:'publicaciones',t:'Publicaciones',p:[['libros','Libros'],['revistas','Revistas'],['documentos-trabajo','Documentos de trabajo'],['actas','Actas'],['otras-publicaciones','Otras publicaciones']]},
 {k:'comunicacion',t:'Comunicación',p:[['noticias','Noticias'],['videos','Videos'],['medios','Presencia en medios'],['boletines','Suscripción a boletines']]}
];
const PAGES={inicio:{t:'Inicio',sec:null}};
MAP.forEach(s=>s.p.forEach(([k,t])=>PAGES[k]={t,sec:s}));
const pageTitle=k=>(PAGES[k]||{t:k}).t;

let db=null,assets=null,canEdit=null,dbState='loading';
let pages={},entries=[],cfg={},query='',editing=null;

/* Utilidades */
let toastT;
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast'+(err?' err':'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3500)}
function md(txt){
  const blocks=String(txt||'').split(/\n\s*\n/);
  return blocks.map(b=>{b=b.trim();if(!b)return'';
    if(b.startsWith('## '))return`<h2>${esc(b.slice(3))}</h2>`;
    const lines=b.split('\n');
    if(lines.every(l=>/^\s*-\s+/.test(l)))return`<ul class="md">${lines.map(l=>`<li>${esc(l.replace(/^\s*-\s+/,''))}</li>`).join('')}</ul>`;
    return`<p>${esc(b).replace(/\n/g,'<br>')}</p>`}).join('');
}
const imgUrl=e=>e.imagen?('/_blob/'+encodeURIComponent(e.imagen)):null;
const entriesOf=k=>entries.filter(e=>e.pagina===k);

/* ===== Sitio público ===== */
function buildChrome(){
  $('#menuList').innerHTML=MAP.map(s=>`<li data-sec="${s.k}"><a href="#p-${s.p[0][0]}">${esc(s.t)}</a><ul class="sub">${s.p.map(([k,t])=>`<li><a href="#p-${k}">${esc(t)}</a></li>`).join('')}</ul></li>`).join('');
  const nombre=cfg.nombre||'CIDS';
  $('#bName').textContent=nombre; $('#bTag').textContent=cfg.bajada||'Centro de Investigación de la Diversidad Sociocultural';
  const ph=(v,l)=>v?esc(v):`<span class="ph">${l}</span>`;
  const col=k=>{const s=MAP.find(x=>x.k===k);return`<div><h4>${esc(s.t)}</h4><ul>${s.p.slice(0,4).map(([p,t])=>`<li><a href="#p-${p}">${esc(t)}</a></li>`).join('')}</ul></div>`};
  $('#foot').innerHTML=`<div><img class="foot-logo" src="${LOGO}" alt="${esc(nombre)}, Centro de Investigación de la Diversidad Sociocultural"><p style="margin:0;color:#ecd3d1">${ph(cfg.descripcion,'Descripción breve de la institución')}</p></div>
   ${col('institucional')}${col('comunicacion')}
   <div><h4>Contacto</h4><ul><li>${ph(cfg.correo,'Correo electrónico')}</li><li>${ph(cfg.telefono,'Teléfono')}</li><li>${ph(cfg.direccion,'Dirección')}</li></ul></div>`;
  $('#copy').textContent=`© ${new Date().getFullYear()} ${nombre}`;
}
function setHead(title,crumbs,secKey){
  $('#ptitle').textContent=title;
  $('#crumbs').innerHTML=['<a href="#inicio">Inicio</a>',...crumbs].join('<span aria-hidden="true">›</span>');
  document.querySelectorAll('#menuList>li').forEach(li=>li.classList.toggle('on',li.dataset.sec===secKey));
}
function sideFor(sec,active){
  return`<h2>En esta sección</h2><ul>${sec.p.map(([k,t])=>`<li><a href="#p-${k}" class="${k===active?'on':''}">${esc(t)}</a></li>`).join('')}</ul>`;
}
function entryList(list){
  return list.map(e=>{const u=imgUrl(e);return`<div class="entry ${u?'':'noimg'}">
    ${u?`<a class="thumb" href="#e-${esc(e.id)}"><img src="${u}" alt=""></a>`:''}
    <div><div class="meta"><span class="cat">${esc(pageTitle(e.pagina))}</span><span>${esc(fmtDate(e.fecha))}</span></div>
    <h3><a href="#e-${esc(e.id)}">${esc(e.titulo)}</a></h3>${e.resumen?`<p>${esc(e.resumen)}</p>`:''}
    <a class="more" href="#e-${esc(e.id)}">Leer más ›</a></div></div>`}).join('');
}
function emptyBox(k){
  return`<div class="empty">Esta sección todavía no tiene contenido.${canEdit!==false&&db?` <a href="#panel-${k}">Cargar contenido</a>`:''}</div>`;
}
function viewPage(k){
  const P=PAGES[k]; const sec=P.sec; const doc=pages[k];
  const title=(doc&&doc.titulo)||P.t;
  $('#layout').classList.toggle('full',!sec);
  if(k==='inicio'){
    setHead(cfg.nombre||'Inicio',[],null); $('#crumbs').innerHTML='Inicio';
    $('#side').innerHTML='';
    const last=entries.slice(0,5);
    $('#main').innerHTML=`<article class="content" style="max-width:none">
      ${doc&&doc.cuerpo?md(doc.cuerpo):emptyBox('inicio')}
      <h2 class="entries-title">Novedades</h2>${last.length?entryList(last):`<div class="empty">Sin novedades publicadas.</div>`}
      <h2 class="entries-title">Mapa del sitio</h2>
      <div class="home-grid">${MAP.map(s=>`<div class="home-card"><h3>${esc(s.t)}</h3><ul>${s.p.map(([p,t])=>`<li><a href="#p-${p}">${esc(t)}</a></li>`).join('')}</ul></div>`).join('')}</div></article>`;
    return;
  }
  setHead(title,[`<a href="#p-${sec.p[0][0]}">${esc(sec.t)}</a>`,esc(title)],sec.k);
  $('#side').innerHTML=sideFor(sec,k);
  const list=entriesOf(k);
  let h='';
  if(dbState==='loading')h=`<div class="empty">Cargando…</div>`;
  else{
    h+=doc&&doc.cuerpo?md(doc.cuerpo):(list.length?'':emptyBox(k));
    if(list.length)h+=`<h2 class="entries-title">Entradas</h2>${entryList(list)}`;
  }
  $('#main').innerHTML=`<article class="content">${h}</article>`;
}
function viewEntry(id){
  const e=entries.find(x=>x.id===id);
  $('#layout').classList.remove('full');
  if(!e){setHead('Entrada',[],null);$('#side').innerHTML='';$('#main').innerHTML=`<div class="empty">${dbState==='loading'?'Cargando…':'No se encontró esta entrada.'}</div>`;return}
  const P=PAGES[e.pagina]||{t:e.pagina,sec:null}; const sec=P.sec;
  setHead(P.t,sec?[`<a href="#p-${sec.p[0][0]}">${esc(sec.t)}</a>`,`<a href="#p-${esc(e.pagina)}">${esc(P.t)}</a>`]:[],sec&&sec.k);
  $('#side').innerHTML=sec?sideFor(sec,e.pagina):'';
  const u=imgUrl(e);
  $('#main').innerHTML=`<article class="content full-entry">
    <div class="meta"><span class="cat">${esc(P.t)}</span><span>${esc(fmtDate(e.fecha))}</span>${e.autor?`<span>${esc(e.autor)}</span>`:''}</div>
    <h1>${esc(e.titulo)}</h1>${u?`<img class="cover" src="${u}" alt="">`:''}
    ${e.resumen?`<p class="lead">${esc(e.resumen)}</p>`:''}${md(e.cuerpo)}
    <p><a class="more" href="#p-${esc(e.pagina)}">‹ Volver a ${esc(P.t)}</a></p></article>`;
}
function viewSearch(){
  $('#layout').classList.add('full');
  setHead('Resultados de búsqueda',['Búsqueda'],null);
  $('#side').innerHTML='';
  const q=query.toLowerCase();
  const es=entries.filter(e=>(e.titulo+' '+(e.resumen||'')+' '+(e.cuerpo||'')).toLowerCase().includes(q));
  const ps=Object.keys(PAGES).filter(k=>{const d=pages[k];return (PAGES[k].t+' '+(d?d.cuerpo||'':'')).toLowerCase().includes(q)});
  $('#main').innerHTML=`<article class="content"><p>Resultados para «${esc(query)}».</p>
    ${ps.length?`<h2 class="entries-title">Secciones</h2><ul class="md">${ps.map(k=>`<li><a href="#p-${k}">${esc(PAGES[k].t)}</a></li>`).join('')}</ul>`:''}
    ${es.length?`<h2 class="entries-title">Entradas</h2>${entryList(es)}`:''}
    ${!ps.length&&!es.length?`<div class="empty">No hay resultados.</div>`:''}</article>`;
}

/* ===== Panel de carga ===== */
function buildTree(active){
  const dot=k=>`<span class="dot ${pages[k]&&pages[k].cuerpo?'':'off'}" title="${pages[k]&&pages[k].cuerpo?'Con texto':'Sin texto'}"></span>`;
  const item=(k,t)=>{const n=entriesOf(k).length;return`<a href="#panel-${k}" class="${k===active?'on':''}"><span>${dot(k)}${esc(t)}</span>${n?`<span class="n">${n}</span>`:''}</a>`};
  $('#tree').innerHTML=`<h3>General</h3><a href="#panel" class="${!active?'on':''}"><span>Datos del sitio</span></a>${item('inicio','Inicio')}`
    +MAP.map(s=>`<h3>${esc(s.t)}</h3>${s.p.map(([k,t])=>item(k,t)).join('')}`).join('');
}
function guard(){
  if(!db){$('#adMain').innerHTML=`<div class="empty">${dbState==='loading'?'Conectando…':'El panel de carga no está disponible en esta vista.'}</div>`;return false}
  if(canEdit===false){$('#adMain').innerHTML=`<div class="empty">Tu acceso permite ver el sitio. Pedí acceso de edición al responsable para cargar contenido.</div>`;return false}
  return true;
}
function viewPanelGeneral(){
  buildTree(null); if(!guard())return;
  const v=k=>esc(cfg[k]||'');
  $('#adMain').innerHTML=`<div class="card"><h2>Datos del sitio</h2><p class="sub">Aparecen en el encabezado y en el pie de todas las páginas.</p>
  <form class="f" id="fCfg">
    <div class="row"><label for="c_nombre">Nombre de la institución<input id="c_nombre" type="text" maxlength="120" value="${v('nombre')}"></label>
    <label for="c_bajada">Bajada<input id="c_bajada" type="text" maxlength="160" value="${v('bajada')}"></label></div>
    <label for="c_desc">Descripción breve (pie de página)<input id="c_desc" type="text" maxlength="300" value="${v('descripcion')}"></label>
    <div class="row"><label for="c_correo">Correo electrónico<input id="c_correo" type="text" maxlength="120" value="${v('correo')}"></label>
    <label for="c_tel">Teléfono<input id="c_tel" type="text" maxlength="60" value="${v('telefono')}"></label></div>
    <label for="c_dir">Dirección<input id="c_dir" type="text" maxlength="200" value="${v('direccion')}"></label>
    <div class="actions"><button class="btn" type="submit">Guardar datos</button></div></form></div>
  <div class="card"><h2>Cómo cargar contenido</h2><p class="sub">Elegí una sección en la columna izquierda. Cada sección tiene un texto principal y una lista de entradas. El punto verde indica que la sección ya tiene texto; el número indica cuántas entradas tiene.</p></div>`;
  $('#fCfg').addEventListener('submit',async ev=>{ev.preventDefault();const b=ev.submitter;b.disabled=true;
    const data={nombre:$('#c_nombre').value.trim(),bajada:$('#c_bajada').value.trim(),descripcion:$('#c_desc').value.trim(),correo:$('#c_correo').value.trim(),telefono:$('#c_tel').value.trim(),direccion:$('#c_dir').value.trim()};
    try{await db.doc('config/sitio').set(data);toast('Datos guardados.')}catch(e){toast(errMsg(e),true)}b.disabled=false});
}
function errMsg(e){return e&&e.code==='invalid_argument'?'Tu cuenta no tiene permiso de edición en este sitio.':(e&&e.code==='quota_exceeded'?'Se alcanzó el límite de documentos. Eliminá entradas antiguas.':'No se pudo guardar. Revisá la conexión e intentá de nuevo.')}
function viewPanelPage(k){
  buildTree(k); if(!guard())return;
  const P=PAGES[k]; const doc=pages[k]||{}; const list=entriesOf(k);
  const e=editing?entries.find(x=>x.id===editing):null;
  const today=new Date().toISOString().slice(0,10);
  $('#adMain').innerHTML=`
  <div class="card"><h2>${esc(P.t)}</h2><p class="sub">${P.sec?esc(P.sec.t)+' · ':''}<a href="#${k==='inicio'?'inicio':'p-'+k}">Ver en el sitio ›</a></p>
    <form class="f" id="fPage">
      <label for="pg_titulo">Título visible <span class="hint">(vacío usa «${esc(P.t)}»)</span><input id="pg_titulo" type="text" maxlength="160" value="${esc(doc.titulo)}"></label>
      <label for="pg_cuerpo">Texto principal <span class="hint">Separá párrafos con una línea en blanco. «## » crea un subtítulo. «- » crea una lista.</span><textarea id="pg_cuerpo">${esc(doc.cuerpo)}</textarea></label>
      <div class="actions"><button class="btn" type="submit">Guardar texto</button></div>
    </form></div>
  <div class="card"><h2>${e?'Editar entrada':'Nueva entrada'}</h2><p class="sub">Las entradas se listan debajo del texto principal y en las novedades del inicio.</p>
    <form class="f" id="fEntry">
      <label for="en_titulo">Título<input id="en_titulo" type="text" required maxlength="160" value="${esc(e&&e.titulo)}"></label>
      <div class="row"><label for="en_fecha">Fecha<input id="en_fecha" type="date" value="${esc((e&&e.fecha)||today)}"></label>
      <label for="en_autor">Autoría<input id="en_autor" type="text" maxlength="120" value="${esc(e&&e.autor)}"></label></div>
      <label for="en_resumen">Resumen <span class="hint">(aparece en los listados)</span><input id="en_resumen" type="text" maxlength="300" value="${esc(e&&e.resumen)}"></label>
      <label for="en_cuerpo">Texto<textarea id="en_cuerpo">${esc(e&&e.cuerpo)}</textarea></label>
      ${assets?`<label for="en_img">Imagen de portada <span class="hint">(opcional)${e&&e.imagen?'. Ya tiene una imagen; subí otra para reemplazarla.':''}</span><input id="en_img" type="file" accept="image/*"></label>`:''}
      <div class="actions"><button class="btn" type="submit">${e?'Guardar cambios':'Publicar entrada'}</button>${e?'<button class="btn ghost" type="button" id="cancelE">Cancelar edición</button>':''}</div>
    </form></div>
  <div class="card"><h2>Entradas de esta sección</h2>
    <div class="tbl"><table class="list"><thead><tr><th>Título</th><th>Fecha</th><th></th></tr></thead><tbody>
    ${list.map(x=>`<tr><td><a href="#e-${esc(x.id)}">${esc(x.titulo)}</a></td><td style="white-space:nowrap">${esc(x.fecha)}</td>
      <td style="white-space:nowrap"><button class="linkbtn" data-edit="${esc(x.id)}">Editar</button><button class="linkbtn del" data-del="${esc(x.id)}">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="3">Sin entradas.</td></tr>'}
    </tbody></table></div></div>`;
  $('#fPage').addEventListener('submit',async ev=>{ev.preventDefault();const b=ev.submitter;b.disabled=true;
    try{await db.doc('paginas/'+k).set({titulo:$('#pg_titulo').value.trim(),cuerpo:$('#pg_cuerpo').value.trim(),actualizado:Date.now()});toast('Texto guardado.')}catch(er){toast(errMsg(er),true)}b.disabled=false});
  $('#fEntry').addEventListener('submit',ev=>saveEntry(ev,k));
  const c=$('#cancelE'); if(c)c.onclick=()=>{editing=null;viewPanelPage(k)};
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;viewPanelPage(k);$('#fEntry').scrollIntoView()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Confirmar';return}
    delEntry(b.dataset.del)});
}
async function saveEntry(ev,k){
  ev.preventDefault(); const b=ev.submitter;
  const titulo=$('#en_titulo').value.trim(); if(!titulo){toast('Escribí un título.',true);return}
  b.disabled=true;
  const prev=editing?entries.find(x=>x.id===editing):null;
  const data={pagina:k,titulo,fecha:$('#en_fecha').value,autor:$('#en_autor').value.trim(),resumen:$('#en_resumen').value.trim(),cuerpo:$('#en_cuerpo').value.trim(),imagen:(prev&&prev.imagen)||null,creado:(prev&&prev.creado)||Date.now()};
  try{
    const f=$('#en_img')&&$('#en_img').files[0];
    if(f&&assets){toast('Subiendo imagen…');const r=await assets.upload(f);
      if(prev&&prev.imagen){try{await assets.delete(prev.imagen)}catch(_){}}
      data.imagen=r.id}
    if(prev)await db.doc('entradas/'+prev.id).set(data); else await db.collection('entradas').add(data);
    editing=null; toast(prev?'Cambios guardados.':'Entrada publicada.'); viewPanelPage(k);
  }catch(er){toast(errMsg(er),true);b.disabled=false}
}
async function delEntry(id){
  const e=entries.find(x=>x.id===id);
  try{await db.doc('entradas/'+id).delete();
    if(e&&e.imagen&&assets){try{await assets.delete(e.imagen)}catch(_){}}
    if(editing===id)editing=null; toast('Entrada eliminada.')}
  catch(er){toast('No se pudo eliminar. Intentá de nuevo.',true)}
}

/* ===== Ruteo ===== */
function render(){
  const h=(location.hash||'#inicio').slice(1);
  const isAdm=h==='panel'||h.startsWith('panel-');
  $('#site').hidden=isAdm; $('#admin').hidden=!isAdm;
  if(isAdm){
    $('#loginWrap').hidden=authed; $('#admBody').hidden=!authed; $('#logout').hidden=!authed;
    if(!authed){if(!$('#loginWrap').contains(document.activeElement))$('#lg_user').focus();return}
    const k=h.slice(6);
    if(k&&PAGES[k])viewPanelPage(k); else viewPanelGeneral();
    return;
  }
  buildChrome();
  if(h==='buscar'&&query)viewSearch();
  else if(h.startsWith('e-'))viewEntry(h.slice(2));
  else if(h.startsWith('p-')&&PAGES[h.slice(2)])viewPage(h.slice(2));
  else viewPage('inicio');
  $('#menu').classList.remove('open');$('#burger').setAttribute('aria-expanded','false');
}
function softRender(){
  const a=document.activeElement;
  if(!$('#admin').hidden&&a&&a.closest&&a.closest('form'))return; // no interrumpir la escritura
  if(!$('#admin').hidden&&document.querySelector('[data-armed]'))return;
  render();
}
/* Acceso con clave al panel */
const KEY_HASH='a9c4086ff8dfedd9666b18c973a36aaae3668ad006fbd318b005f3680ebfecd8';
let authed=false;
try{authed=sessionStorage.getItem('panelAuth')===KEY_HASH}catch(_){}
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let tries=0;
$('#fLogin').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const u=$('#lg_user').value.trim().toLowerCase(), p=$('#lg_pass').value;
  let h=''; try{h=await sha256(u+':'+p)}catch(_){}
  if(h===KEY_HASH){authed=true;tries=0;try{sessionStorage.setItem('panelAuth',KEY_HASH)}catch(_){}
    $('#lg_pass').value='';$('#lgErr').textContent='';render()}
  else{tries++;$('#lgErr').textContent='Usuario o clave incorrectos. Revisá los datos e intentá de nuevo.';$('#lg_pass').value='';
    if(tries>=5){const b=ev.submitter;b.disabled=true;setTimeout(()=>{b.disabled=false;tries=0},30000);$('#lgErr').textContent='Demasiados intentos. Esperá 30 segundos.'}}
});
$('#logout').onclick=()=>{authed=false;try{sessionStorage.removeItem('panelAuth')}catch(_){}render()};
window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#panel-'))editing=null;render();window.scrollTo(0,0)});
$('#burger').onclick=()=>{const m=$('#menu');m.classList.toggle('open');$('#burger').setAttribute('aria-expanded',m.classList.contains('open'))};
$('#searchForm').addEventListener('submit',e=>{e.preventDefault();query=$('#q').value.trim();if(!query)return;if(location.hash!=='#buscar')location.hash='buscar';else render()});
render();

/* ===== Datos ===== */
(async()=>{
  try{
    const [d,u,a]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('assets')]);
    db=d;assets=a;
    if(u){try{canEdit=await u.canEdit()}catch(_){canEdit=null}}
    if(!db){dbState='off';render();return}
    let got=0;const ready=()=>{if(++got>=3)dbState='ok';softRender()};
    const fail=()=>{dbState='off';softRender()};
    db.collection('paginas').onSnapshot(s=>{pages={};s.docs.forEach(x=>pages[x.id]=x.data());ready()},fail);
    db.collection('entradas').orderBy('fecha','desc').onSnapshot(s=>{entries=s.docs.map(x=>({id:x.id,...x.data()}));ready()},fail);
    db.doc('config/sitio').onSnapshot(s=>{cfg=s.exists?s.data():{};ready()},fail);
  }catch(_){dbState='off';render()}
})();
})();
</script>

</body></html>
